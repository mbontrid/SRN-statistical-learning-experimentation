[project]
name = "srn-statistical-learning-experimentation"
version = "0.1.0"
description = "Experimentation (playground) of simple recursive network in the domain of human statistical learning."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "ipywidgets>=8.1.8",
  "jupyter-book>=2.1.4",
  "matplotlib>=3.10.9",
  "numpy>=2.4.2",
  "numpyarray-to-latex>=0.1.0",
  "pandas>=3.0.1",
  "scikit-learn>=1.8.0",
  "scipy>=1.17.1",
  "torch>=2.10.0",
  "tqdm>=4.67.3",
  "xlrd>=2.0.2",
]

[tool.uv]
dev-dependencies = ["debugpy>=1.8.20", "pytest>=9.0.2"]

[tool.setuptools.packages.find]
where = ["src"]
